# Render Blueprint for the backend API (the storefront is deployed separately on Vercel).
# DEMO SETUP (free plan): the free plan has no persistent disk, so admin-uploaded images are wiped on every
# restart/redeploy and the service sleeps after ~15 min idle. For production, switch to `plan: starter`, add
#   disk: { name: uploads, mountPath: /var/data, sizeGB: 5 }
# and set UPLOADS_DIR=/var/data/uploads so uploaded images survive.
services:
  - type: web
    name: dryfruit-wholesale-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Secrets and per-environment values are entered in the Render dashboard (never committed)
      - key: MONGO_URI
        sync: false
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: ADMIN_LOGIN_EMAIL
        sync: false
      # The Vercel storefront origin, e.g. https://your-store.vercel.app (comma-separate several)
      - key: CLIENT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SMS_API_KEY
        sync: false
